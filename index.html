<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roger Corso Arquitetura e Interiores</title>
    <meta
      name="description"
      content="Apresentação comercial de Roger Corso Arquitetura e Interiores em Bauru - SP."
    />
    <style>
      :root {
        --bg: #070709;
        --bg-deep: #000000;
        --surface: #111115;
        --surface-soft: #ffffff08;
        --surface-glass: #ffffff12;
        --cream: #edebe6;
        --cream-strong: #f3eee6;
        --cream-ink: #1a1712;
        --text: #edebe6;
        --text-mid: #edebe6ad;
        --text-dim: #edebe66b;
        --text-faint: #edebe638;
        --gold: #c9b298;
        --gold-bright: #e4d8ca;
        --gold-deep: #8d7556;
        --gold-05: #c9b2980d;
        --gold-10: #c9b2981a;
        --gold-20: #c9b29833;
        --gold-30: #c9b2984d;
        --border: #ffffff12;
        --border-strong: #ffffff24;
        --maxw: 1280px;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --serif: "Instrument Serif", "Iowan Old Style", "Times New Roman", serif;
        --sans: "Inter Tight", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 16% 12%, var(--gold-10), transparent 28rem),
          linear-gradient(135deg, #000 0%, var(--bg) 48%, #0c0a08 100%);
        color: var(--text);
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.5;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .presentation-shell {
        min-height: 100vh;
        position: relative;
      }

      .presentation-shell::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(var(--border) 1px, transparent 1px),
          linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 82px 82px;
        mask-image: linear-gradient(to bottom, #000 0%, transparent 78%);
        opacity: 0.26;
        z-index: 0;
      }

      .top-nav {
        position: fixed;
        left: 50%;
        top: 20px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 8px;
        width: min(calc(100% - 28px), 980px);
        padding: 8px 8px 8px 20px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #070709cf;
        box-shadow: inset 0 0 0 1px #ffffff14, 0 10px 40px #0008, 0 4px 20px #c9b29826;
        backdrop-filter: blur(14px);
      }

      .brand-mark {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: max-content;
        color: var(--cream-strong);
        font-family: var(--serif);
        font-size: 18px;
      }

      .brand-mark::before {
        content: "RC";
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        color: var(--cream-ink);
        background: var(--gold);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0;
        box-shadow: 0 0 24px var(--gold-30);
      }

      .nav-links {
        display: flex;
        justify-content: center;
        gap: 2px;
        width: 100%;
      }

      .nav-link {
        min-height: 38px;
        padding: 11px 13px;
        border-radius: 999px;
        color: var(--text-mid);
        font-size: 13px;
        font-weight: 500;
        transition: color 0.3s var(--ease), background 0.3s var(--ease), transform 0.3s var(--ease);
      }

      .nav-link:hover,
      .nav-link.is-active {
        color: var(--cream-strong);
        background: var(--surface-glass);
        transform: translateY(-1px);
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 46px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        color: var(--cream-strong);
        background: transparent;
        box-shadow: inset 0 0 0 1px #ffffff26, 0 10px 40px #c9b29840;
        font-family: var(--sans);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.35s var(--ease), color 0.35s var(--ease), box-shadow 0.35s var(--ease);
      }

      .button:hover {
        color: var(--gold-bright);
        transform: translateY(-2px);
        box-shadow: inset 0 0 0 1px #ffffff30, 0 16px 50px #c9b29866;
      }

      .button.secondary {
        color: var(--text-mid);
        box-shadow: inset 0 0 0 1px #8d755680;
      }

      .button.compact {
        min-height: 38px;
        padding: 0 18px;
        font-size: 13px;
      }

      main {
        position: relative;
        z-index: 1;
      }

      .slide-section {
        min-height: 100vh;
        display: grid;
        align-items: center;
        padding: 108px 24px 64px;
        border-bottom: 1px solid var(--border);
        page-break-after: always;
      }

      .slide-inner {
        width: min(100%, var(--maxw));
        margin: 0 auto;
      }

      .slide-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 34px;
      }

      .eyebrow,
      .badge,
      .kicker {
        color: var(--gold);
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      h1,
      h2 {
        margin: 0;
        color: var(--cream-strong);
        font-family: var(--serif);
        font-weight: 400;
        letter-spacing: 0;
      }

      h1 {
        max-width: 760px;
        font-size: clamp(48px, 7vw, 108px);
        line-height: 0.94;
      }

      h2 {
        max-width: 760px;
        font-size: clamp(38px, 5vw, 76px);
        line-height: 1;
      }

      h3 {
        margin: 0;
        color: var(--cream-strong);
        font-size: 20px;
        font-weight: 600;
        line-height: 1.3;
      }

      p {
        margin: 0;
      }

      .lead {
        max-width: 760px;
        color: var(--text-mid);
        font-size: clamp(18px, 2vw, 25px);
        line-height: 1.45;
      }

      .support {
        max-width: 680px;
        color: var(--text-dim);
        font-size: 16px;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.03fr) minmax(360px, 0.9fr);
        gap: 54px;
        align-items: center;
      }

      .hero-copy {
        display: grid;
        gap: 26px;
      }

      .hero-specialty {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        color: var(--gold);
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .hero-meta {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        max-width: 760px;
      }

      .meta-card,
      .commercial-card,
      .contact-card {
        border-radius: 20px;
        background: linear-gradient(150deg, #ffffff0f, #ffffff05);
        box-shadow: inset 0 0 0 1px #ffffff18;
      }

      .meta-card {
        min-height: 106px;
        padding: 18px;
      }

      .meta-card strong {
        display: block;
        margin-bottom: 8px;
        color: var(--cream-strong);
        font-size: 15px;
      }

      .meta-card span {
        color: var(--text-dim);
        font-size: 13px;
      }

      .hero-actions,
      .contact-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }

      .architecture-panel {
        position: relative;
        min-height: 590px;
        overflow: hidden;
        border-radius: 20px;
        background:
          linear-gradient(90deg, transparent 0 48%, #ffffff12 48% 49%, transparent 49%),
          linear-gradient(0deg, transparent 0 48%, #ffffff10 48% 49%, transparent 49%),
          radial-gradient(circle at 76% 18%, #c9b29824, transparent 11rem),
          linear-gradient(145deg, #16110d, #060607 54%, #14100b);
        box-shadow: inset 0 0 0 1px #ffffff22, 0 32px 90px -45px #c9b29880;
      }

      .architecture-panel::before,
      .architecture-panel::after {
        content: "";
        position: absolute;
        border: 1px solid #c9b29852;
      }

      .architecture-panel::before {
        inset: 54px 48px 104px 72px;
      }

      .architecture-panel::after {
        width: 52%;
        height: 42%;
        right: 62px;
        bottom: 64px;
        border-left: 0;
      }

      .plan-line {
        position: absolute;
        background: #edebe626;
      }

      .plan-line.one {
        width: 1px;
        height: 68%;
        left: 34%;
        top: 16%;
      }

      .plan-line.two {
        width: 58%;
        height: 1px;
        left: 22%;
        top: 38%;
      }

      .plan-line.three {
        width: 1px;
        height: 38%;
        right: 28%;
        top: 38%;
      }

      .experience-seal {
        position: absolute;
        right: 34px;
        top: 32px;
        display: grid;
        place-items: center;
        width: 142px;
        height: 142px;
        border-radius: 50%;
        color: var(--cream-ink);
        background: var(--gold);
        box-shadow: 0 18px 60px #c9b29866;
        text-align: center;
      }

      .experience-seal strong {
        display: block;
        font-family: var(--serif);
        font-size: 40px;
        font-weight: 400;
        line-height: 0.9;
      }

      .experience-seal span {
        display: block;
        margin-top: 6px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .profile-photo-wrap {
        position: absolute;
        left: 38px;
        bottom: 164px;
        z-index: 2;
        width: min(42%, 230px);
        aspect-ratio: 0.82;
        padding: 10px;
        border-radius: 20px;
        background:
          linear-gradient(145deg, #ffffff12, #ffffff03),
          radial-gradient(circle at 24% 12%, #c9b29824, transparent 9rem);
        box-shadow:
          inset 0 0 0 1px #ffffff24,
          0 24px 70px -30px #c9b2988a,
          0 18px 60px #0008;
      }

      .profile-photo-wrap::before {
        content: "";
        position: absolute;
        inset: -18px;
        z-index: -1;
        border-radius: 28px;
        background: radial-gradient(circle at 42% 44%, #c9b29833, transparent 62%);
        filter: blur(18px);
      }

      .profile-photo {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 14px;
        object-fit: cover;
        object-position: center top;
        filter: saturate(0.92) contrast(1.04) brightness(0.92);
        mix-blend-mode: luminosity;
        opacity: 0.92;
      }

      .panel-caption {
        position: absolute;
        left: 34px;
        bottom: 34px;
        width: min(72%, 340px);
        color: var(--text-mid);
        font-size: 15px;
      }

      .panel-caption b {
        display: block;
        margin-bottom: 8px;
        color: var(--cream-strong);
        font-family: var(--serif);
        font-size: 30px;
        font-weight: 400;
        line-height: 1;
      }

      .content-stack {
        display: grid;
        gap: 22px;
        margin-bottom: 38px;
      }

      .card-grid {
        display: grid;
        gap: 16px;
      }

      .problem-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .service-grid {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }

      .service-grid .commercial-card {
        grid-column: span 2;
      }

      .service-grid .commercial-card.featured {
        grid-column: span 6;
        display: grid;
        grid-template-columns: 160px minmax(0, 1fr) auto;
        align-items: center;
        gap: 28px;
      }

      .partnership-layout {
        display: grid;
        grid-template-columns: minmax(340px, 0.82fr) minmax(0, 1fr);
        gap: 32px;
        align-items: stretch;
      }

      .commercial-card {
        position: relative;
        min-height: 238px;
        padding: 28px;
        overflow: hidden;
        transition: transform 0.38s var(--ease), box-shadow 0.38s var(--ease);
      }

      .commercial-card:hover {
        transform: translateY(-3px);
        box-shadow: inset 0 0 0 1px #c9b29824, 0 20px 60px -20px #c9b2982e;
      }

      .commercial-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #c9b29814, transparent 42%);
        opacity: 0;
        transition: opacity 0.35s var(--ease);
      }

      .commercial-card:hover::before {
        opacity: 1;
      }

      .card-content {
        position: relative;
        display: grid;
        gap: 16px;
        height: 100%;
      }

      .card-index {
        color: var(--gold);
        font-family: var(--mono);
        font-size: 12px;
      }

      .card-content p {
        color: var(--text-mid);
        font-size: 15px;
      }

      .card-rule {
        width: 100%;
        height: 1px;
        margin-top: auto;
        background: linear-gradient(90deg, var(--gold), transparent);
        opacity: 0.42;
      }

      .closing-line {
        margin-top: 22px;
        padding: 24px 28px;
        border-left: 1px solid var(--gold);
        color: var(--cream-strong);
        background: linear-gradient(90deg, #c9b29812, transparent);
        font-family: var(--serif);
        font-size: clamp(24px, 3vw, 40px);
        line-height: 1.12;
      }

      .step-label {
        display: grid;
        place-items: center;
        width: 118px;
        height: 118px;
        border-radius: 50%;
        color: var(--cream-ink);
        background: var(--gold);
        font-family: var(--serif);
        font-size: 48px;
        box-shadow: 0 18px 60px #c9b29852;
      }

      .ecosystem {
        position: relative;
        min-height: 520px;
        border-radius: 20px;
        background:
          linear-gradient(var(--border) 1px, transparent 1px),
          linear-gradient(90deg, var(--border) 1px, transparent 1px),
          linear-gradient(145deg, #ffffff0d, #ffffff03);
        background-size: 58px 58px, 58px 58px, auto;
        box-shadow: inset 0 0 0 1px #ffffff18;
      }

      .ecosystem-center {
        position: absolute;
        left: 50%;
        top: 50%;
        display: grid;
        place-items: center;
        width: 190px;
        height: 190px;
        padding: 24px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        color: var(--cream-ink);
        background: var(--gold);
        box-shadow: 0 24px 80px #c9b29866;
        text-align: center;
        font-family: var(--serif);
        font-size: 30px;
        line-height: 1;
      }

      .partner-node {
        position: absolute;
        width: min(270px, 42%);
      }

      .partner-node:nth-child(2) {
        left: 28px;
        top: 30px;
      }

      .partner-node:nth-child(3) {
        right: 28px;
        top: 54px;
      }

      .partner-node:nth-child(4) {
        left: 42px;
        bottom: 42px;
      }

      .partner-node:nth-child(5) {
        right: 42px;
        bottom: 28px;
      }

      .partner-node .commercial-card {
        min-height: 164px;
        padding: 20px;
      }

      .contact-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(340px, 0.62fr);
        gap: 34px;
        align-items: stretch;
      }

      .service-list {
        display: grid;
        gap: 10px;
        margin-top: 28px;
      }

      .service-list span {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--text-mid);
      }

      .service-list span::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 12px #c9b298;
      }

      .contact-card {
        padding: 30px;
      }

      .contact-panel {
        display: grid;
        gap: 22px;
      }

      .contact-row {
        display: grid;
        gap: 4px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--border);
      }

      .contact-row:last-child {
        padding-bottom: 0;
        border-bottom: 0;
      }

      .contact-row span {
        color: var(--gold);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .contact-row a,
      .contact-row strong {
        color: var(--cream-strong);
        font-size: 18px;
        font-weight: 500;
      }

      .section-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-top: 36px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
        color: var(--text-faint);
        font-size: 12px;
      }

      .footer-page-number {
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 12px;
      }

      @media (max-width: 1040px) {
        .top-nav {
          align-items: flex-start;
          border-radius: 22px;
          padding: 12px;
        }

        .brand-mark {
          display: none;
        }

        .nav-links {
          justify-content: flex-start;
          overflow-x: auto;
          scrollbar-width: none;
        }

        .hero-grid,
        .partnership-layout,
        .contact-layout {
          grid-template-columns: 1fr;
        }

        .architecture-panel {
          min-height: 460px;
        }

        .problem-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .service-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .service-grid .commercial-card,
        .service-grid .commercial-card.featured {
          grid-column: auto;
        }

        .service-grid .commercial-card.featured {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 680px) {
        .slide-section {
          min-height: auto;
          padding: 108px 16px 52px;
        }

        .top-nav {
          top: 10px;
          width: calc(100% - 20px);
        }

        .nav-link {
          min-width: max-content;
          padding: 10px 12px;
        }

        .nav-cta {
          display: none;
        }

        h1 {
          font-size: 52px;
        }

        h2 {
          font-size: 42px;
        }

        .hero-meta,
        .problem-grid,
        .service-grid {
          grid-template-columns: 1fr;
        }

        .architecture-panel {
          min-height: 380px;
        }

        .experience-seal {
          right: 18px;
          top: 18px;
          width: 112px;
          height: 112px;
        }

        .experience-seal strong {
          font-size: 34px;
        }

        .profile-photo-wrap {
          left: 22px;
          bottom: 150px;
          width: 138px;
          padding: 7px;
          border-radius: 16px;
        }

        .profile-photo {
          border-radius: 11px;
        }

        .panel-caption {
          left: 22px;
          bottom: 22px;
          width: calc(100% - 44px);
        }

        .ecosystem {
          display: grid;
          gap: 14px;
          min-height: 0;
          padding: 18px;
        }

        .ecosystem-center,
        .partner-node {
          position: static;
          width: auto;
          transform: none;
        }

        .ecosystem-center {
          width: auto;
          height: auto;
          min-height: 96px;
          border-radius: 20px;
        }

      }

      @media print {
        html {
          scroll-behavior: auto;
        }

        body {
          background: #070709;
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }

        .top-nav {
          display: none;
        }

        .presentation-shell::before {
          position: absolute;
        }

        .slide-section {
          min-height: 100vh;
          padding: 38px;
          break-after: page;
          page-break-after: always;
        }

        .button {
          box-shadow: inset 0 0 0 1px #ffffff26;
        }
      }
    </style>
  </head>
  <body>
    <div class="presentation-shell">
      <nav class="top-nav" aria-label="Navegação da apresentação">
        <a class="brand-mark" href="#capa" aria-label="Ir para a capa">Roger Corso</a>
        <div class="nav-links" id="nav-links"></div>
        <a class="button compact nav-cta" href="https://wa.me/5514998728880">WhatsApp</a>
      </nav>

      <main id="presentation"></main>
    </div>

    <script>
      const presentation = {
        footer: "Roger Corso Arquitetura & Interiores | Bauru - SP",
        contact: {
          name: "Roger Corso",
          role: "Arquiteto e Designer de Interiores",
          whatsapp: "(14) 99872-8880",

          email: "roger@rcaarquitetura.com.br",

          location: "Bauru - SP e região",
        },
        slides: [
          {
            id: "capa",
            nav: "Capa",
            type: "hero",
            title: "Roger Corso Arquitetura e Interiores",
            specialty: ["Arquitetura", "Interiores", "Reforma inteligente"],
            name: "Roger Corso",
            message:
              "Arquitetura prática para comprar, reformar e valorizar imóveis em Bauru com segurança, estética e controle de investimento.",
            support:
              "Ajudo pessoas a transformar imóveis em decisões seguras — antes, durante e depois da reforma.",
            action: "Atendimento para imóveis residenciais, reformas, ambientes planejados e valorização imobiliária.",
            credentials: ["Arquiteto & Urbanista", "Designer de Interiores"],
            experience: "Mais de 10 anos de experiência",
            proof: "Atuação em arquitetura, interiores e gestão em construtora",
          },
          {
            id: "problema",
            nav: "Problema",
            eyebrow: "Apresentação comercial",
            title: "O problema que resolvo",
            text:
              "Comprar, reformar ou planejar um imóvel envolve risco. O cliente geralmente decide com pouca visão técnica, sem clareza de prioridade e sem saber onde pode desperdiçar dinheiro.",
            cards: [
              {
                title: "Insegurança",
                text: "O imóvel tem potencial? O custo da reforma cabe no orçamento?",
              },
              {
                title: "Decisão técnica",
                text: "Layout, marcenaria, iluminação, acabamentos e prioridades.",
              },
              {
                title: "Controle",
                text: "Menos retrabalho, compras erradas e improvisos na obra.",
              },
              {
                title: "Valorização",
                text: "Estética, função e melhor percepção de valor.",
              },
            ],
            closing:
              "Minha entrega não começa no desenho. Começa na clareza: o que fazer, por onde começar e como evitar decisões caras.",
          },
          {
            id: "servicos",
            nav: "Serviços",
            eyebrow: "Apresentação comercial",
            title: "Serviços de entrada",
            text:
              "Produtos simples para começar com baixo risco, gerar confiança e abrir caminho para projetos maiores.",
            cards: [
              {
                title: "Diagnóstico de imóvel",
                text: "Visita técnica para avaliar potencial, limitações, riscos e prioridades antes da compra ou reforma.",
              },
              {
                title: "Plano de reforma inteligente",
                text: "Organização das etapas, layout inicial, referências e direção para orçamento e execução com menos improviso.",
              },
              {
                title: "Ambiente pronto",
                text: "Projeto objetivo para sala, quarto, varanda, home office, consultório ou área gourmet, com conceito e especificações básicas.",
              },
              {
                title: "Acompanhamento técnico",
                text: "Visitas e orientação durante reforma, marcenaria ou montagem, com escopo definido e responsabilidade técnica quando aplicável.",
              },
              {
                title: "Projeto completo",
                text: "Para clientes que já validaram a necessidade e desejam uma solução autoral, estética e funcional para todo o imóvel.",
                featured: true,
              },
            ],
          },
          {
            id: "parcerias",
            nav: "Parcerias",
            eyebrow: "Apresentação comercial",
            title: "Como funcionam as parcerias",
            text:
              "Parcerias devem criar valor para todos: cliente mais seguro, parceiro mais confiável e projeto melhor conduzido. O modelo é transparente, sem comissão oculta e com escopo claro.",
            cards: [
              {
                title: "Imobiliárias e corretores",
                text: "Consultoria para compradores: avaliação de potencial, riscos e possibilidades do imóvel.",
              },
              {
                title: "Marcenarias",
                text: "Projeto e orientação para ambientes planejados, facilitando a venda consultiva e evitando retrabalho.",
              },
              {
                title: "Lojas de decoração",
                text: "Consultorias, curadoria de escolhas e ações educativas para clientes em decisão de compra.",
              },
              {
                title: "Construtoras e escritórios",
                text: "Gestão de projetos, atendimento técnico, compatibilização e apoio em demandas específicas.",
              },
            ],
            closing:
              "A proposta: aumentar a segurança de compra, melhorar a experiência do cliente e transformar indicação em valor percebido.",
          },
          {
            id: "contato",
            nav: "Contato",
            eyebrow: "Apresentação comercial",
            title: "Vamos conversar?",
            text:
              "Se o seu cliente está comprando, reformando ou planejando um imóvel, uma orientação técnica no momento certo pode evitar desperdício e acelerar uma boa decisão.",
            cta:
              "Agende uma conversa inicial para entender o imóvel, o momento do cliente e o formato de atendimento mais adequado.",
            services: [
              "Diagnóstico de imóvel",
              "Plano de reforma inteligente",
              "Ambiente pronto",
              "Acompanhamento técnico",
              "Projeto completo",
            ],
          },
        ],
      };

      const iconArrow = '<span aria-hidden="true">↗</span>';

      function sectionFooter(index) {
        return `
          <footer class="section-footer">
            <span>${presentation.footer}</span>
            ${index > 0 ? `<span class="footer-page-number">${String(index + 1).padStart(2, "0")}</span>` : ""}
          </footer>
        `;
      }

      function commercialCard(card, index, variant = "") {
        return `
          <article class="commercial-card ${card.featured ? "featured" : ""} ${variant}">
            <div class="card-content">
              ${card.featured ? '<div class="step-label">05</div>' : `<span class="card-index">${String(index + 1).padStart(2, "0")}</span>`}
              <div>
                <h3>${card.title}</h3>
                <p>${card.text}</p>
              </div>
              <span class="card-rule" aria-hidden="true"></span>
            </div>
          </article>
        `;
      }

      function renderHero(slide, index) {
        return `
          <section class="slide-section" id="${slide.id}" aria-labelledby="${slide.id}-title">
            <div class="slide-inner hero-grid">
              <div class="hero-copy">
                <div class="hero-specialty">${slide.specialty.map((item) => `<span>${item}</span>`).join("<span>|</span>")}</div>
                <h1 id="${slide.id}-title">${slide.title}</h1>
                <p class="lead">${slide.message}</p>
                <p class="support">${slide.support}</p>
                <div class="hero-meta" aria-label="Credenciais e atuação">
                  <div class="meta-card"><strong>${slide.name}</strong><span>${slide.credentials.join("<br />")}</span></div>
                  <div class="meta-card"><strong>${slide.experience}</strong><span>${slide.proof}</span></div>
                  <div class="meta-card"><strong>Atuação</strong><span>${slide.action}</span></div>
                </div>
                <div class="hero-actions">
                  <a class="button" href="${presentation.contact.whatsappUrl}">Agendar conversa ${iconArrow}</a>
                  <a class="button secondary" href="${presentation.contact.instagramUrl}">Instagram</a>
                </div>
                ${sectionFooter(index)}
              </div>
              <aside class="architecture-panel" aria-label="Composição visual arquitetônica">
                <span class="plan-line one"></span>
                <span class="plan-line two"></span>
                <span class="plan-line three"></span>
                <div class="experience-seal"><div><strong>+10</strong><span>anos de experiência</span></div></div>
                <figure class="profile-photo-wrap" aria-label="Foto de Roger Corso">
                  <img class="profile-photo" src="file:///D:/Arquiteto/perfil.png" alt="Roger Corso" />
                </figure>
                <p class="panel-caption"><b>Clareza antes da obra.</b>Leitura técnica, estética e comercial para decisões imobiliárias mais seguras.</p>
              </aside>
            </div>
          </section>
        `;
      }

      function renderStandard(slide, index) {
        const gridClass = slide.id === "problema" ? "problem-grid" : "service-grid";
        return `
          <section class="slide-section" id="${slide.id}" aria-labelledby="${slide.id}-title">
            <div class="slide-inner">
              <header class="slide-header">
                <span class="eyebrow">${slide.eyebrow}</span>
              </header>
              <div class="content-stack">
                <h2 id="${slide.id}-title">${slide.title}</h2>
                <p class="lead">${slide.text}</p>
              </div>
              <div class="card-grid ${gridClass}">
                ${slide.cards.map((card, cardIndex) => commercialCard(card, cardIndex)).join("")}
              </div>
              ${slide.closing ? `<p class="closing-line">${slide.closing}</p>` : ""}
              ${sectionFooter(index)}
            </div>
          </section>
        `;
      }

      function renderPartnership(slide, index) {
        return `
          <section class="slide-section" id="${slide.id}" aria-labelledby="${slide.id}-title">
            <div class="slide-inner">
              <header class="slide-header">
                <span class="eyebrow">${slide.eyebrow}</span>
              </header>
              <div class="partnership-layout">
                <div class="content-stack">
                  <h2 id="${slide.id}-title">${slide.title}</h2>
                  <p class="lead">${slide.text}</p>
                  <p class="closing-line">${slide.closing}</p>
                </div>
                <div class="ecosystem" aria-label="Mapa de ecossistema de parcerias">
                  <div class="ecosystem-center">Cliente mais seguro</div>
                  ${slide.cards.map((card, cardIndex) => `<div class="partner-node">${commercialCard(card, cardIndex)}</div>`).join("")}
                </div>
              </div>
              ${sectionFooter(index)}
            </div>
          </section>
        `;
      }

      function renderContact(slide, index) {
        return `
          <section class="slide-section" id="${slide.id}" aria-labelledby="${slide.id}-title">
            <div class="slide-inner">
              <header class="slide-header">
                <span class="eyebrow">${slide.eyebrow}</span>
              </header>
              <div class="contact-layout">
                <div>
                  <div class="content-stack">
                    <h2 id="${slide.id}-title">${slide.title}</h2>
                    <p class="lead">${slide.text}</p>
                    <p class="support">${slide.cta}</p>
                  </div>
                  <div class="contact-actions">
                    <a class="button" href="${presentation.contact.whatsappUrl}">Agendar pelo WhatsApp ${iconArrow}</a>
                    <a class="button secondary" href="${presentation.contact.emailUrl}">Enviar e-mail</a>
                  </div>
                  <div class="service-list" aria-label="Serviços">
                    <span class="kicker">Serviços</span>
                    ${slide.services.map((service) => `<span>${service}</span>`).join("")}
                  </div>
                </div>
                <aside class="contact-card contact-panel" aria-label="Contato">
                  <div class="contact-row"><span>Contato</span><strong>${presentation.contact.name}</strong><strong>${presentation.contact.role}</strong></div>
                  <div class="contact-row"><span>WhatsApp</span><a href="${presentation.contact.whatsappUrl}">${presentation.contact.whatsapp}</a></div>
                  <div class="contact-row"><span>Instagram</span><a href="${presentation.contact.instagramUrl}">${presentation.contact.instagram}</a></div>
                  <div class="contact-row"><span>E-mail</span><a href="${presentation.contact.emailUrl}">${presentation.contact.email}</a></div>
                  <div class="contact-row"><span>Atendimento</span><strong>${presentation.contact.location}</strong></div>
                </aside>
              </div>
              ${sectionFooter(index)}
            </div>
          </section>
        `;
      }

      const renderers = {
        hero: renderHero,
        parcerias: renderPartnership,
        contato: renderContact,
      };

      document.querySelector("#presentation").innerHTML = presentation.slides
        .map((slide, index) => {
          if (slide.type === "hero") return renderHero(slide, index);
          if (slide.id === "parcerias") return renderPartnership(slide, index);
          if (slide.id === "contato") return renderContact(slide, index);
          return renderStandard(slide, index);
        })
        .join("");

      document.querySelector("#nav-links").innerHTML = presentation.slides
        .map((slide) => `<a class="nav-link" href="#${slide.id}">${slide.nav}</a>`)
        .join("");

      const navLinks = Array.from(document.querySelectorAll(".nav-link"));
      const sections = presentation.slides
        .map((slide) => document.getElementById(slide.id))
        .filter(Boolean);

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            navLinks.forEach((link) => {
              link.classList.toggle("is-active", link.getAttribute("href") === `#${entry.target.id}`);
            });
          });
        },
        { rootMargin: "-42% 0px -42% 0px", threshold: 0.01 }
      );

      sections.forEach((section) => observer.observe(section));
    </script>
  </body>
</html>
